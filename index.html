<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бомбардиры и Рейтинг Сезона</title>
    <style>
        :root { --prm: #007bff; --suc: #28a745; --dng: #dc3545; --drk: #343a40; }
        body { font-family: -apple-system, sans-serif; margin: 10px; background: #f0f2f5; padding-bottom: 30px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .flex-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 20px; margin: 0; color: var(--drk); }
        h2 { font-size: 16px; margin: 0 0 10px 0; color: #555; }
        .btn-set { background: #ffc107; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-main { width: 100%; padding: 14px; font-size: 16px; background: var(--suc); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-main:active { background: #1e7e34; }
        .btn-danger { background: var(--dng); }
        .btn-danger:active { background: #bd2130; }
        
        /* Стили интерактивной таблицы */
        table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 10px; }
        th, td { padding: 10px 5px; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: var(--drk); color: white; cursor: pointer; user-select: none; position: relative; }
        th:active { background: #000; }
        th.sort-asc::after { content: " ▲"; font-size: 10px; }
        th.sort-desc::after { content: " ▼"; font-size: 10px; }
        
        .admin-only { display: none; }
        body.is-admin .admin-only { display: block; }
        .admin-cell { display: none; }
        body.is-admin .admin-cell { display: table-cell; }
        .sync-info { font-size: 13px; color: #666; margin-top: 8px; text-align: center; font-style: italic; }
        .badge-rating { font-weight: bold; color: var(--prm); font-size: 14px; }
        .btn-remove-player {
            background: none; border: none; cursor: pointer; font-size: 16px;
            padding: 4px 6px; border-radius: 4px; color: var(--dng);
        }
        .btn-remove-player:hover { background: #ffecec; }
        .btn-remove-player:disabled { color: #ccc; cursor: not-allowed; }
        .btn-remove-player:disabled:hover { background: none; }
        .autogoal-row { background: #fff8e1; }
        .autogoal-row td:first-child { color: #b8860b; }
        .autogoal-tag {
            display: inline-block; font-size: 10px; font-weight: bold;
            background: #ffe9a8; color: #8a5a00; padding: 1px 6px;
            border-radius: 8px; margin-left: 6px; vertical-align: middle;
        }

        /* Форма редактирования имени */
        .rename-row { display: flex; flex-direction: column; gap: 8px; }
        .rename-row select, .rename-row input {
            padding: 10px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 14px; box-sizing: border-box; width: 100%;
        }
        .rename-actions { display: flex; gap: 8px; }
        .btn-secondary {
            flex: 1; padding: 10px 16px; background: #fff; color: var(--prm);
            border: 1px solid var(--prm); border-radius: 6px; font-weight: bold;
            cursor: pointer; font-size: 14px;
        }
        .btn-secondary:hover { background: #eaf3ff; }
    </style>
</head>
<body>

    <div class="flex-hdr">
        <h1>🏆 Статистика и Рейтинг Сезона</h1>
        <button class="btn-set" id="lock-btn" onclick="activateAdminMode()">🔑 Вход Админа</button>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ АДМИНА -->
    <div class="card admin-only">
        <h2>Панель управления сезоном</h2>
        <button class="btn-main" onclick="syncLastGames()">🔄 Занести результаты и рассчитать рейтинг дня</button>
        <div class="sync-info" id="sync-status">Готовы к импорту данных и начислению очков командам</div>
        <button class="btn-main btn-danger" style="margin-top: 15px; padding: 10px;" onclick="resetSeasonData()">🗑 Сбросить ВСЮ статистику сезона</button>
    </div>

    <!-- ФОРМА ДОБАВЛЕНИЯ ИГРОКА (только для админа) -->
    <div class="card admin-only">
        <h2>➕ Добавить нового игрока</h2>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="playerName" placeholder="Введите имя игрока"
                   style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
            <button onclick="addPlayer()"
                    style="background: var(--prm); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Добавить
            </button>
        </div>
        <div id="add-status" class="sync-info" style="margin-top: 8px;"></div>
    </div>

    <!-- ФОРМА РЕДАКТИРОВАНИЯ ИМЕНИ ИГРОКА (только для админа) -->
    <div class="card admin-only">
        <h2>✏ Изменить имя игрока</h2>
        <div class="rename-row">
            <select id="rename-old">
                <option value="">— Выберите игрока —</option>
            </select>
            <input type="text" id="rename-new" placeholder="Новое имя игрока">
            <div class="rename-actions">
                <button class="btn-secondary" onclick="renamePlayer()">Изменить имя</button>
            </div>
        </div>
        <div id="rename-status" class="sync-info" style="margin-top: 8px;"></div>
    </div>

    <!-- ТАБЛИЦА БОМБАРДИРОВ И РЕЙТИНГА СЕЗОНА -->
    <div class="card" style="overflow-x: auto;">
        <h2>📊 Сводный рейтинг (Нажмите на заголовок для сортировки)</h2>
        <table>
            <thead>
                <tr>
                    <th onclick="sortTable('rank')">№</th>
                    <th style="text-align: left; padding-left: 10px;" onclick="sortTable('name')">Игрок</th>
                    <th onclick="sortTable('goals')">Голы</th>
                    <th onclick="sortTable('games')">Игры</th>
                    <th onclick="sortTable('winPts')">Рейт.П</th>
                    <th onclick="sortTable('avgRating')">Сред.Р</th>
                    <th class="admin-cell" style="width: 40px;">🗑</th>
                </tr>
            </thead>
            <tbody id="season-scorers-body">
                <tr><td colspan="7" style="color:#888; padding:20px;">Загрузка данных...</td></tr>
            </tbody>
        </table>
    </div>

<script>
    const FIREBASE_URL = "https://football-7ea89-default-rtdb.europe-west1.firebasedatabase.app";
    const AUTOGOAL = "Автогол";

    let seasonScorers = {}; 
    let processedMatchIds = []; 
    
    let currentSortColumn = 'avgRating'; 
    let currentSortDirection = 'desc'; 

    function activateAdminMode() {
        let pin = prompt("Введите пароль Администратора:");
        if (pin === "55555") { 
            document.body.classList.add('is-admin');
            document.getElementById('lock-btn').style.display = 'none';
            alert("Права администратора подтверждены!");
            renderSeasonTable();
            refreshRenameSelect();
        } else {
            alert("Неверный пароль!");
        }
    }

    async function loadSeasonData() {
        try {
            let res = await fetch(FIREBASE_URL + "/season_archive.json");
            let archive = await res.json();
            if (archive) {
                seasonScorers = archive.seasonScorers || {};
                processedMatchIds = archive.processedMatchIds || [];
            }

            // Автоматически создаём спец-игрока «Автогол», если его нет
            let needSaveAutogoal = false;
            if (!seasonScorers[AUTOGOAL]) {
                seasonScorers[AUTOGOAL] = { goals: 0, games: 0, winPts: 0 };
                needSaveAutogoal = true;
            }

            renderSeasonTable();
            refreshRenameSelect();

            if (needSaveAutogoal) {
                await fetch(FIREBASE_URL + "/season_archive.json", {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seasonScorers: seasonScorers,
                        processedMatchIds: processedMatchIds
                    })
                });
            }
        } catch (e) {
            console.log("Ошибка загрузки архива сезона", e);
        }
    }

    // Перерисовка <select> в форме редактирования имени
    function refreshRenameSelect() {
        let sel = document.getElementById('rename-old');
        if (!sel) return;
        let currentVal = sel.value;
        let names = Object.keys(seasonScorers).sort();
        let html = '<option value="">— Выберите игрока —</option>' +
            names.map(function(n) {
                let isAuto = (n === AUTOGOAL);
                return '<option value="' + n.replace(/"/g, '&quot;') + '">' + n + (isAuto ? ' (служебный)' : '') + '</option>';
            }).join('');
        sel.innerHTML = html;
        if (currentVal && seasonScorers[currentVal]) sel.value = currentVal;
    }

    function sortTable(column) {
        if (currentSortColumn === column) {
            currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            currentSortColumn = column;
            currentSortDirection = 'desc';
        }
        renderSeasonTable();
    }

    function renderSeasonTable() {
        let playersArray = Object.keys(seasonScorers).map(function(name) {
            let p = seasonScorers[name];
            let goals = p.goals || 0;
            let gamesCount = p.games || 0;
            let winPts = p.winPts || 0;
            
            // У «Автогола» рейтинг победителя всегда 0 (не начисляется)
            if (name === AUTOGOAL) winPts = 0;

            // Средний рейтинг:
            // - обычные игроки: (winPts + goals) / games
            // - Автогол: goals / games (winPts = 0, поэтому фактически та же формула)
            let avg = gamesCount > 0 ? ((winPts + goals) / gamesCount) : 0;
            avg = Math.round(avg * 100) / 100; 

            return {
                name: name,
                goals: goals,
                games: gamesCount,
                winPts: winPts,
                avgRating: avg
            };
        });

        // Сортируем всех, включая Автогол, по обычным правилам
        playersArray.sort(function(a, b) {
            let valA = a[currentSortColumn];
            let valB = b[currentSortColumn];

            if (typeof valA === 'string') {
                return currentSortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                return currentSortDirection === 'asc' ? valA - valB : valB - valA;
            }
        });

        let tbody = document.getElementById('season-scorers-body');
        if (!tbody) return;

        if (playersArray.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="color:#888; padding:20px;">Статистики пока нет</td></tr>';
            return;
        }

        tbody.innerHTML = playersArray.map(function(p, idx) {
            let safeName = p.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            let isAuto = (p.name === AUTOGOAL);
            let rowClass = isAuto ? ' class="autogoal-row"' : '';
            let nameDisplay = isAuto
                ? '<span style="font-style:italic; color:#8a5a00;">' + p.name + '</span><span class="autogoal-tag">служебный</span>'
                : p.name;

            let removeBtn = isAuto
                ? '<button class="btn-remove-player" disabled title="Служебного игрока удалять нельзя">🔒</button>'
                : '<button class="btn-remove-player" title="Удалить игрока" ' +
                  'onclick="removePlayer(\'' + safeName + '\')">🗑</button>';

            return '<tr' + rowClass + '>' +
                '<td>' + (idx + 1) + '</td>' +
                '<td style="text-align:left; padding-left:10px; font-weight:bold;">' + nameDisplay + '</td>' +
                '<td>' + p.goals + '</td>' +
                '<td>' + p.games + '</td>' +
                '<td>' + p.winPts + '</td>' +
                '<td><span class="badge-rating">' + p.avgRating.toFixed(2) + '</span></td>' +
                '<td class="admin-cell">' + removeBtn + '</td>' +
            '</tr>';
        }).join('');
    }

    // Удаление игрока (кроме Автогола)
    async function removePlayer(playerName) {
        if (!document.body.classList.contains('is-admin')) {
            alert("Удалять игроков может только администратор!");
            return;
        }

        if (playerName === AUTOGOAL) {
            alert('Служебного игрока «' + AUTOGOAL + '» удалить нельзя.');
            return;
        }

        if (!seasonScorers[playerName]) {
            alert('Игрок "' + playerName + '" не найден в таблице.');
            return;
        }

        if (!confirm('Удалить игрока "' + playerName + '" из таблицы рейтинга?\n\n' +
                     'Его статистика (голы, игры, очки) будет стёрта. ' +
                     'Само имя тоже исчезнет из таблицы, и при синхронизации новые данные на него не будут начисляться, ' +
                     'пока вы снова не добавите его через форму «Добавить нового игрока».')) return;

        let backup = seasonScorers[playerName];
        delete seasonScorers[playerName];

        try {
            await fetch(FIREBASE_URL + "/season_archive.json", {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seasonScorers: seasonScorers,
                    processedMatchIds: processedMatchIds
                })
            });
            renderSeasonTable();
            refreshRenameSelect();
            let statusEl = document.getElementById('add-status');
            if (statusEl) statusEl.innerText = 'Игрок "' + playerName + '" удалён из таблицы.';
        } catch (e) {
            seasonScorers[playerName] = backup;
            alert('Ошибка сохранения в базу данных. Игрок не удалён.');
        }
    }

    // Добавление игрока
    async function addPlayer() {
        if (!document.body.classList.contains('is-admin')) {
            alert("Добавлять игроков может только администратор!");
            return;
        }

        const input = document.getElementById('playerName');
        const statusEl = document.getElementById('add-status');
        const playerName = input.value.trim();

        if (!playerName) {
            alert('Пожалуйста, введите имя игрока');
            return;
        }

        if (playerName === AUTOGOAL) {
            alert('Имя «' + AUTOGOAL + '» зарезервировано для служебного игрока.');
            return;
        }

        const existing = Object.keys(seasonScorers).find(
            name => name.toLowerCase() === playerName.toLowerCase()
        );
        if (existing) {
            alert('Игрок с таким именем уже есть в рейтинге: ' + existing);
            return;
        }

        seasonScorers[playerName] = { goals: 0, games: 0, winPts: 0 };

        try {
            await fetch(FIREBASE_URL + "/season_archive.json", {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seasonScorers: seasonScorers,
                    processedMatchIds: processedMatchIds
                })
            });

            input.value = '';
            if (statusEl) statusEl.innerText = 'Игрок "' + playerName + '" добавлен в рейтинг.';
            renderSeasonTable();
            refreshRenameSelect();
        } catch (e) {
            delete seasonScorers[playerName];
            alert('Ошибка сохранения в базу данных. Игрок не добавлен.');
            if (statusEl) statusEl.innerText = 'Ошибка соединения.';
        }
    }

    // Редактирование имени игрока
    async function renamePlayer() {
        if (!document.body.classList.contains('is-admin')) {
            alert("Редактировать имена может только администратор!");
            return;
        }

        const sel = document.getElementById('rename-old');
        const input = document.getElementById('rename-new');
        const statusEl = document.getElementById('rename-status');
        const oldName = sel ? sel.value : '';
        const newName = input ? input.value.trim() : '';

        if (!oldName) {
            alert('Выберите игрока, чьё имя хотите изменить.');
            return;
        }
        if (!seasonScorers[oldName]) {
            alert('Выбранный игрок не найден в таблице (возможно, удалён).');
            return;
        }
        if (!newName) {
            alert('Введите новое имя игрока.');
            return;
        }
        if (newName === oldName) {
            alert('Новое имя совпадает с текущим — менять нечего.');
            return;
        }
        if (oldName === AUTOGOAL) {
            alert('Имя служебного игрока «' + AUTOGOAL + '» менять нельзя.');
            return;
        }
        if (newName === AUTOGOAL) {
            alert('Имя «' + AUTOGOAL + '» зарезервировано для служебного игрока.');
            return;
        }

        const dup = Object.keys(seasonScorers).find(function(n) {
            return n !== oldName && n.toLowerCase() === newName.toLowerCase();
        });
        if (dup) {
            alert('Игрок с именем "' + dup + '" уже есть в таблице.');
            return;
        }

        if (!confirm('Переименовать игрока "' + oldName + '" → "' + newName + '"?\n\n' +
                     'Вся статистика (голы, игры, баллы) сохранится. ' +
                     'Старые записи в истории матчей турнира останутся под прежним именем, ' +
                     'но они уже учтены — повторно ничего не начислится.')) return;

        let backup = seasonScorers[oldName];
        seasonScorers[newName] = backup;
        delete seasonScorers[oldName];

        try {
            await fetch(FIREBASE_URL + "/season_archive.json", {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seasonScorers: seasonScorers,
                    processedMatchIds: processedMatchIds
                })
            });

            input.value = '';
            if (statusEl) statusEl.innerText = 'Игрок "' + oldName + '" переименован в "' + newName + '".';
            renderSeasonTable();
            refreshRenameSelect();
        } catch (e) {
            seasonScorers[oldName] = backup;
            delete seasonScorers[newName];
            alert('Ошибка сохранения в базу данных. Имя не изменено.');
            if (statusEl) statusEl.innerText = 'Ошибка соединения.';
        }
    }

    async function syncLastGames() {
        if (!document.body.classList.contains('is-admin')) return;
        document.getElementById('sync-status').innerText = "Считывание текущего турнира...";

        try {
            let res = await fetch(FIREBASE_URL + "/tournament.json");
            let tournamentData = await res.json();
            
            if (!tournamentData || !tournamentData.games) {
                alert("В текущем турнире нет сыгранных матчей для переноса!");
                document.getElementById('sync-status').innerText = "Нет новых игр.";
                return;
            }

            let currentGames = Object.values(tournamentData.games);
            let currentTeams = tournamentData.teams || ["Команда 1", "Команда 2", "Команда 3"];
            let currentTeamPlayers = tournamentData.teamPlayers || {};
            
            // 1. СЧИТАЕМ ИТОГОВЫЕ МЕСТА КОМАНД ДНЯ (1, 2, 3)
            let dayStats = {};
            currentTeams.forEach(function(t) {
                dayStats[t] = { pts: 0, gf: 0 };
            });

            currentGames.forEach(function(g) {
                if (g && dayStats[g.t1] && dayStats[g.t2]) {
                    dayStats[g.t1].gf += g.s1;
                    dayStats[g.t2].gf += g.s2;
                    if (g.s1 > g.s2) { dayStats[g.t1].pts += 3; } 
                    else if (g.s1 < g.s2) { dayStats[g.t2].pts += 3; } 
                    else { dayStats[g.t1].pts += 1; dayStats[g.t2].pts += 1; }
                }
            });

            let sortedTeamsOfDay = [...currentTeams].sort(function(a, b) {
                if (dayStats[b].pts !== dayStats[a].pts) return dayStats[b].pts - dayStats[a].pts;
                return dayStats[b].gf - dayStats[a].gf;
            });

            let firstPlaceTeam = sortedTeamsOfDay[0];
            let secondPlaceTeam = sortedTeamsOfDay[1];
            let thirdPlaceTeam = sortedTeamsOfDay[2];

            let newMatchesCount = 0;
            let activePlayersToday = new Set();
            let skippedPlayers = new Set();

            // 2. РАСПРЕДЕЛЯЕМ ГОЛЫ И ФИКСИРУЕМ УЧАСТИЕ
            currentGames.forEach(function(game) {
                if (game && game.id && processedMatchIds.indexOf(game.id) === -1) {
                    if (game.scorers1) {
                        game.scorers1.forEach(function(player) {
                            let key = player.trim();
                            if (seasonScorers[key]) {
                                seasonScorers[key].goals += 1;
                            } else if (key) {
                                skippedPlayers.add(key);
                            }
                        });
                    }
                    
                    let pList1 = currentTeamPlayers[game.t1] || [];
                    pList1.forEach(function(p) {
                        let key = p.trim();
                        if (!key) return;
                        if (seasonScorers[key]) activePlayersToday.add(key);
                        else skippedPlayers.add(key);
                    });

                    if (game.scorers2) {
                        game.scorers2.forEach(function(player) {
                            let key = player.trim();
                            if (seasonScorers[key]) {
                                seasonScorers[key].goals += 1;
                            } else if (key) {
                                skippedPlayers.add(key);
                            }
                        });
                    }
                    
                    let pList2 = currentTeamPlayers[game.t2] || [];
                    pList2.forEach(function(p) {
                        let key = p.trim();
                        if (!key) return;
                        if (seasonScorers[key]) activePlayersToday.add(key);
                        else skippedPlayers.add(key);
                    });

                    processedMatchIds.push(game.id);
                    newMatchesCount++;
                }
            });

            if (newMatchesCount === 0) {
                alert("Все матчи этого турнирного дня уже были занесены ранее!");
                document.getElementById('sync-status').innerText = "Новых матчей не обнаружено.";
                return;
            }

            // 3. НАЧИСЛЯЕМ ИГРЫ И БАЛЛЫ ЗА МЕСТА (1→+3, 2→+2, 3→+1).
            // «Автогол» — служебный: games начисляется (если он есть в составе),
            // но winPts всегда 0.
            let playersOfTeam1 = (currentTeamPlayers[firstPlaceTeam] || []).map(function(p){ return p.trim(); });
            let playersOfTeam2 = (currentTeamPlayers[secondPlaceTeam] || []).map(function(p){ return p.trim(); });
            let playersOfTeam3 = (currentTeamPlayers[thirdPlaceTeam] || []).map(function(p){ return p.trim(); });

            activePlayersToday.forEach(function(player) {
                if (!seasonScorers[player]) return;

                // games начисляется всем, включая Автогола
                seasonScorers[player].games += 1;

                // Баллы за места — только реальным игрокам
                if (player === AUTOGOAL) return;

                if (playersOfTeam1.indexOf(player) !== -1) {
                    seasonScorers[player].winPts += 3;
                } else if (playersOfTeam2.indexOf(player) !== -1) {
                    seasonScorers[player].winPts += 2;
                } else if (playersOfTeam3.indexOf(player) !== -1) {
                    seasonScorers[player].winPts += 1;
                }
            });

            // У «Автогола» принудительно держим winPts = 0
            if (seasonScorers[AUTOGOAL]) seasonScorers[AUTOGOAL].winPts = 0;

            // 4. СОХРАНЯЕМ В FIREBASE
            await fetch(FIREBASE_URL + "/season_archive.json", {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seasonScorers: seasonScorers, processedMatchIds: processedMatchIds })
            });

            let statusMsg = "Рейтинг обновлен! Занесено матчей: " + newMatchesCount;
            if (skippedPlayers.size > 0) {
                statusMsg += ". Пропущены (нет в таблице): " + Array.from(skippedPlayers).join(', ');
            }
            document.getElementById('sync-status').innerText = statusMsg;
            
            let alertMsg = "Синхронизация завершена! Всем участникам из таблицы начислен +1 игровой день. " +
                           "Места команд дня: 1-е → +3, 2-е → +2, 3-е → +1.";
            if (skippedPlayers.size > 0) {
                alertMsg += "\n\nВНИМАНИЕ: следующие игроки есть в составе, но отсутствуют в таблице рейтинга, поэтому статистика им НЕ начислена:\n— " +
                            Array.from(skippedPlayers).join("\n— ") +
                            "\n\nЕсли их нужно учитывать, добавьте их через форму «Добавить нового игрока» заранее.";
            }
            alert(alertMsg);
            renderSeasonTable();
            refreshRenameSelect();

        } catch (e) {
            alert("Ошибка соединения с базой данных.");
            document.getElementById('sync-status').innerText = "Ошибка соединения.";
        }
    }

    async function resetSeasonData() {
        if (!document.body.classList.contains('is-admin')) return;
        if (!confirm("ВНИМАНИЕ! Вы хотите полностью стереть историю СЕЗОНА и обнулить все рейтинги?\n\n" +
                     "Служебный игрок «" + AUTOGOAL + "» будет создан заново с нулевыми показателями.")) return;

        seasonScorers = {};
        seasonScorers[AUTOGOAL] = { goals: 0, games: 0, winPts: 0 };
        processedMatchIds = [];

        await fetch(FIREBASE_URL + "/season_archive.json", {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ seasonScorers: seasonScorers, processedMatchIds: processedMatchIds })
        });

        alert("Статистика сезона полностью обнулена! Служебный игрок «" + AUTOGOAL + "» сброшен.");
        renderSeasonTable();
        refreshRenameSelect();
        document.getElementById('sync-status').innerText = "Архив сезона пуст.";
    }

    window.onload = function() {
        loadSeasonData();
        setInterval(loadSeasonData, 5000);
    };
</script>
</body>
</html>
